name: release-images

on:
  push:
    branches: [main]
    paths:
      - "tools/mock-provider/**"
      - "collectors/token-usage/**"
      - "mart/token-usage/**"
      - ".github/workflows/release-images.yml"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - context: tools/mock-provider
            image: token-mock-provider
          - context: collectors/token-usage
            image: token-usage-collector
          - context: mart/token-usage
            image: token-mart
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract SHA7
        id: sha7
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/yoonsungnam/${{ matrix.image }}:latest
            ghcr.io/yoonsungnam/${{ matrix.image }}:${{ steps.sha7.outputs.sha7 }}
