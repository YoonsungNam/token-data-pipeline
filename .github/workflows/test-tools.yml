name: test-tools

on:
  push:
    branches: [main]
    paths: ["tools/data-admin/**", ".github/workflows/test-tools.yml"]
  pull_request:
    paths: ["tools/data-admin/**", ".github/workflows/test-tools.yml"]

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/data-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v
