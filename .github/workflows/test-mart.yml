name: test-mart

on:
  push:
    branches: [main]
    paths: ["mart/token-usage/**", "collectors/token-usage/ddl/**", "tools/mock-provider/**",
            ".github/workflows/test-mart.yml"]
  pull_request:
    paths: ["mart/token-usage/**", "collectors/token-usage/ddl/**", "tools/mock-provider/**",
            ".github/workflows/test-mart.yml"]

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          docker buildx build --platform linux/amd64 \
            -t token-mart:ci mart/token-usage --load
      - name: Test image
        run: docker run --rm token-mart:ci python -m app.batch --help

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kustomize stage
        run: kubectl kustomize mart/token-usage/k8s/overlays/stage > /tmp/m-stage.yaml
      - name: Kustomize company
        run: kubectl kustomize mart/token-usage/k8s/overlays/company > /tmp/m-company.yaml
      - name: Contract fields locked
        run: |
          for f in /tmp/m-stage.yaml /tmp/m-company.yaml; do
            grep -q 'activeDeadlineSeconds: 1800' "$f"
            grep -q 'schedule: 0 4 \* \* \*' "$f"
            grep -q 'concurrencyPolicy: Forbid' "$f"
            grep -q 'timeZone: Asia/Seoul' "$f"
            grep -q 'backoffLimit: 1' "$f"
            grep -q 'memory: 1Gi' "$f"
            grep -q 'memory: 256Mi' "$f"
            grep -q 'name: registry-pull-secret' "$f"
            grep -q 'name: token-mart-ch-secret' "$f"
            ! grep -q 'EXPECTED_LATE_SERVICES' "$f"
          done
          grep -q 'ghcr.io/yoonsungnam/token-mart' /tmp/m-stage.yaml

  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mart/token-usage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v --ignore=tests/e2e

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r mart/token-usage/requirements-dev.txt
      - name: Run E2E
        run: ./mart/token-usage/tests/e2e/run_e2e.sh
