name: test-mart

on:
  push:
    branches: [main]
    paths: ["mart/token-usage/**", "tools/mock-provider/**",
            ".github/workflows/test-mart.yml"]
  pull_request:
    paths: ["mart/token-usage/**", "tools/mock-provider/**",
            ".github/workflows/test-mart.yml"]

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mart/token-usage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v --ignore=tests/e2e

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r mart/token-usage/requirements-dev.txt
      - name: Run E2E
        run: ./mart/token-usage/tests/e2e/run_e2e.sh
